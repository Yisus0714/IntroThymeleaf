<!doctype html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Saludo Dinamico</title>
</head>
<body>
<h1 th:text="${saludo}" th:style="${claseCss}">Lorem ipsum</h1>

<h3>Objetos implicitos y utilidades</h3>
<ul>
    <li>
        <strong>1.Session</strong>
        <span th:text="${session.rol}">Invitado</span>
    </li>
    <li>
        <strong>2.Parametros</strong>
        <span th:text="${param.nombre != null ? param.nombre : 'Ninguno' }"></span>
    </li>
    <li>
        <strong>3.Utilidades</strong>
        Fecha Actual Formateada: <span th:text="${#dates.format(#dates.createNow(),'dd/MM/yyyy')}"></span>
    </li>
</ul>
</body>
</html>
